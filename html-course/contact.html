<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact page</title>
  </head>
  <body>
    <h1>contact me</h1>
    <form>
      <div>
        <label for="username">username : </label>
        <input type="text" id="username" placeholder="username" />
      </div>
      <div>
        <label for="email">email:</label>
        <input type="email" id="email" placeholder="email" />
      </div>
      <div>
        <label for="color">favorite color:</label>
        <input type="color" id="color" />
      </div>
      <div>
        <label for="file">file</label>
        <input type="file" id="file" />
      </div>
      <button>send</button>
    </form>
    <!--
    *nav : liens de 4 sections de plage 
    *section 1 : hero : nom et prenom + photo
    *section 2 : title 'about ' + description
    *section 3 : title resume + video 
    *section 4 : contact , title contact ; form nom , email et textarea
    *footer : les liens de reseaux sociaux ou wikipeadia
    *
    -->
  </body>
</html>
