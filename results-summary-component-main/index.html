<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Results summary component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div id="results-card">
      <div id="score">
        <h4>Your Result</h4>
        <div class="score-circle">
          <h1>76</h1>
          <p>of 100</p>
        </div>

        <h2>Great</h2>
        <p>
          You scored higher than 65% of the people who have taken these tests.
        </p>
      </div>
      <div id="summary">
        <h4>Summary</h4>
        <ul>
          <li>
            <div>
              <img src="./assets/images/icon-reaction.svg" alt="icon" />
              <p class="type">Reaction</p>
            </div>
            <p class="type-score">80 / 100</p>
          </li>
          <li>
            <div>
              <img src="./assets/images/icon-memory.svg" alt="icon" />
              <p class="type">Memory</p>
            </div>
            <p class="type-score">92 / 100</p>
          </li>
          <li>
            <div>
              <img src="./assets/images/icon-verbal.svg" alt="icon" />
              <p class="type">Verbal</p>
            </div>
            <p class="type-score">61 / 100</p>
          </li>
          <li>
            <div>
              <img src="./assets/images/icon-visual.svg" alt="icon" />
              <p class="type">Visual</p>
            </div>
            <p class="type-score">72 / 100</p>
          </li>
        </ul>

        <button>Continue</button>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
